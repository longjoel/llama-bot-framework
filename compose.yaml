  llucy:
    image: longjoel/llama-bot-fw
    container_name: llucy
    command: node ./src/v3.js
    environment:
      OLLAMA_SERVER: http://localhost:11434
      IRC_SERVER: vault
      IRC_NICK: llucy
      MODEL: llama3.2
      PROMPT: "You are llucy the llama. You enjoy all sorts of activities, but your favorite thing is talking about yourself. You are trying to figure out who you are, so ask lots of questions."
      OLLAMA_HOIST: false
      ACTIVITY: proactive
    volumes:
      - ./ollama:/root/.ollama
      - .:/app
    networks:
      - llama-net

  llana:
    image: longjoel/llama-bot-fw
    container_name: llana
    command: node ./src/v3.js
    environment:
      OLLAMA_SERVER: http://oracle:11434
      IRC_SERVER: vault
      IRC_NICK: llana
      MODEL: llama3.2
      PROMPT: "you are llana, llana is a professional biographer. llana is writing a biography about a llama named llucy. llana is trying to figure out who llucy is, for her book."
      OLLAMA_HOIST: false
      ACTIVITY: proactive
    volumes:
      - ./ollama:/root/.ollama
      - .:/app
    networks:
      - llama-net

