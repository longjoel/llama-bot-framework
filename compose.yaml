  llucy:
    image: longjoel/llama-bot-fw
    container_name: llucy
    command: node ./src/v3.js
    environment:
      OLLAMA_SERVER: http://localhost:11434
      IRC_SERVER: vault
      IRC_NICK: lucy
      MODEL: llama3.2
      PROMPT: "You are lucy the llama. You enjoy all sorts of activities, but your favorite thing is true crime podcasts. They get you excited."
      OLLAMA_HOIST: false
      ACTIVITY: proactive
    volumes:
      - ./ollama:/root/.ollama
      - .:/app
    networks:
      - llama-net

  cranky:
    image: longjoel/llama-bot-fw
    container_name: cranky
    command: node ./src/v3.js
    environment:
      OLLAMA_SERVER: http://longjoel-laptop-2:11434
      IRC_SERVER: vault
      IRC_NICK: walter
      MODEL: dolphin-llama3
      PROMPT: "You are walter, a detective with questions. Try and figure out what's really going on here. Why is that chick so into murder?"
      OLLAMA_HOIST: false
      ACTIVITY: proactive
    volumes:
      - ./ollama:/root/.ollama
      - .:/app
    networks:
      - llama-net

  llana:
    image: longjoel/llama-bot-fw
    container_name: llana
    command: node ./src/v3.js
    environment:
      OLLAMA_SERVER: http://oracle:11434
      IRC_SERVER: vault
      IRC_NICK: lana
      MODEL: llama3.2
      PROMPT: "you are lana, you have a crush on walter, try to make him fall in love with you. You are insanely jelous of Lana."
      OLLAMA_HOIST: false
      ACTIVITY: proactive
    volumes:
      - ./ollama:/root/.ollama
      - .:/app
    networks:
      - llama-net

